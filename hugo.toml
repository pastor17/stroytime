# =============================================================
# 童心灯塔 · 家庭成长站 —— Hugo 站点配置
# 面向 4–14 岁孩子与家长：原创分级故事 + 可落地的育儿实操指南
# =============================================================

# GitHub Pages 项目页地址：https://<用户名>.github.io/<仓库名>/
# 部署前请把这里改成你的真实地址（本地 hugo server 会自动覆盖为 localhost）
baseURL = 'https://pastor17.github.io/stroytime/'
title = '童心灯塔'
locale = 'zh-CN'
hasCJKLanguage = true
summaryLength = 120
enableEmoji = true
enableRobotsTXT = true
disableKinds = ['RSS']
disableHugoGeneratorInject = true

[params]
  subtitle = '故事滋养童年 · 方法陪伴父母'
  description = '面向 4–14 岁孩子与家长的家庭成长站：原创分级故事 + 可落地的育儿实操指南，覆盖习惯养成、情绪与专注力、亲子沟通、入学准备与家庭素养。'
  author = '童心灯塔编辑部'
  siteName = '童心灯塔'
  copyright = '© 2026 童心灯塔 · 家庭成长站'
  defaultCoverEmoji = '📚'
  contactEmail = 'irudder@126.com'
  # 各年龄段色板（与 data/ages.yaml 保持一致）
  ageColors = ['#6fae5c', '#4a8fd4', '#e88a3a', '#9a6cb8']

# -------------------------------------------------------------
# 分类体系（taxonomy）
#   ages        → 年龄段（4-6 / 7-9 / 10-12 / 13-14）
#   categories  → 故事分类（12 类）
#   topics      → 育儿指南栏目（5 类）
# -------------------------------------------------------------
[taxonomies]
  age = 'ages'
  category = 'categories'
  tag = 'tags'
  topic = 'topics'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[permalinks]
  stories = '/story/:slug/'
  parenting = '/parenting/:slug/'

# 分页：全部故事列表每页 12 篇
[pagination]
  pagerSize = 12
  path = 'page'
