  name: "同胞与家庭协作"
  emoji: "👨‍👩‍👧‍👦"
  color: "#7a9e4f"
  tagline: "育儿不是一个人的战场"
  description: "二胎争宠、老人带娃、爸爸缺席、夫妻分歧——这些矛盾不解决，再多育儿技巧都会在家庭内耗里失效。这一栏处理「一家人怎么配合」。"
  ages: ["4-6", "7-9", "10-12"]
