  emoji: "💬"
  color: "#4a8fd4"
  tagline: "好好说话，是最省力的教育"
  description: "怎样听、怎样问、怎样说「不」而不伤感情——提供可以直接照着说的话术，把每天的冲突时刻变成连接时刻。"
  ages: ["4-6", "7-9", "10-12", "13-14"]
  painPoints:
