- slug: "parent-self"
  name: "家长自我关怀"
  emoji: "🫶"
  color: "#c96f8e"
  tagline: "先照顾好自己，才有力气照顾孩子"
  description: "父母不是永动机。发火、内疚、焦虑、失落——这些都不是你不够好，而是没人告诉过你该怎么安放。这一栏写给家长自己。"
  ages: ["4-6", "7-9", "10-12", "13-14"]
  painPoints:
    - "一点小事就控制不住发火，发完又后悔"
    - "吼完孩子，他躲着我，我也恨自己"
    - "半夜刷手机，越刷越焦虑"
    - "孩子越大越不亲我，心里空落落的"
  cover: "/img/parenting/parent-self.jpg"

