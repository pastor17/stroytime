<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand__logo" aria-hidden="true">📖</span>
      <span class="brand__text">
        <strong>{{ site.Title }}</strong>
        <small>{{ site.Params.subtitle }}</small>
      </span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-expanded="false" aria-controls="siteNav">
      <span></span><span></span><span></span>
    </button>
    <div class="site-search" id="siteSearch" role="search">
      <input type="search" id="searchInput" placeholder="搜索故事、指南、活动…" aria-label="搜索" autocomplete="off">
      <div class="site-search__results" id="searchResults" hidden></div>
    </div>
    <nav class="site-nav" id="siteNav" aria-label="主导航">
      <a href="{{ site.Home.RelPermalink }}">首页</a>
      <a href="{{ "stories/" | relURL }}">故事库</a>
      <a class="is-new" href="{{ "parenting/" | relURL }}">亲子学堂</a>
      <a href="{{ "ages/" | relURL }}">按年龄</a>
      <a href="{{ "categories/" | relURL }}">按主题</a>
      <a class="is-new" href="{{ "seasons/" | relURL }}">🎄 节日</a>
      <a class="is-new" href="{{ "activities/" | relURL }}">🎨 活动</a>
      <a href="{{ "about/" | relURL }}">关于</a>
    </nav>
  </div>
</header>
