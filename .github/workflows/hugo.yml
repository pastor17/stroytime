# 将 Hugo 站点构建并部署到 GitHub Pages 的工作流
# 使用前提：仓库 Settings → Pages → Source 选择 "GitHub Actions"
name: Deploy Hugo site to Pages

on:
  # 推送到 story 分支时触发（故事站点部署在 story 分支）
  push:
    branches: ["story"]
  # 允许手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限，让部署能写 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次部署，取消进行中的旧部署
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 与本机开发环境保持一致（模板使用了 v0.156+ 才有的 hugo.Data 接口）
      HUGO_VERSION: 0.165.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          tar -xzf ${{ runner.temp }}/hugo.tar.gz -C ${{ runner.temp }}
          sudo mv ${{ runner.temp }}/hugo /usr/local/bin/hugo
          hugo version
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
